name: Reusable macOS Sparkle release

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Repository-relative release manifest path
        required: false
        type: string
        default: .wisent-desktop-release.json
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      RELEASE_BOOTSTRAP_TOKEN:
        required: false
      AC_API_KEY_ID:
        required: true
      AC_API_ISSUER_ID:
        required: true
      AC_API_KEY_P8:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: true
      WISENT_APP_PROVISIONING_PROFILE:
        required: false
      WISENT_NETWORK_FILTER_PROVISIONING_PROFILE:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, stado]
    timeout-minutes: 60
    concurrency:
      group: desktop-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Read and validate release manifest
        id: release
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("release tags must use immutable vMAJOR.MINOR.PATCH syntax")
          version = tag[1:]
          path = pathlib.Path(os.environ["MANIFEST_PATH"])
          data = json.loads(path.read_text())
          if data.get("schema") != 1:
              raise SystemExit("release manifest schema must be 1")
          required = ["product", "bundle_id", "bundle_path", "build_command", "archive_name", "feed_url"]
          for key in required:
              value = data.get(key)
              if not isinstance(value, str) or not value.strip() or "\n" in value:
                  raise SystemExit(f"release manifest {key} must be one non-empty line")
          feed_url = data["feed_url"]
          expected_feed = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/appcast.xml"
          if feed_url != expected_feed:
              raise SystemExit(f"feed_url must be {expected_feed}")
          archive_name = data["archive_name"].replace("{version}", version)
          if "/" in archive_name or not archive_name.endswith(".zip"):
              raise SystemExit("archive_name must be a .zip filename")
          backend = data.get("backend") or {}
          if not isinstance(backend, dict):
              raise SystemExit("backend must be an object")
          backend_repository = backend.get("repository", "")
          backend_revision_file = backend.get("revision_file", "")
          backend_checkout_path = backend.get("checkout_path", ".release-source")
          backend_revision = ""
          if backend_repository:
              if not backend_revision_file:
                  raise SystemExit("backend.revision_file is required with backend.repository")
              backend_revision = pathlib.Path(backend_revision_file).read_text().strip()
              if not re.fullmatch(r"[0-9a-f]{40}", backend_revision):
                  raise SystemExit("backend revision must be one full Git commit SHA")
          values = {
              "version": version,
              "product": data["product"],
              "bundle_id": data["bundle_id"],
              "bundle_path": data["bundle_path"],
              "build_command": data["build_command"],
              "archive_name": archive_name,
              "feed_url": feed_url,
              "minimum_system_version": data.get("minimum_system_version", "14.0"),
              "backend_repository": backend_repository,
              "backend_revision": backend_revision,
              "backend_checkout_path": backend_checkout_path,
          }
          for key, value in values.items():
              if not isinstance(value, str) or "\n" in value:
                  raise SystemExit(f"release manifest output {key} must be one line")
              print(f"{key}={value}")
          PY

      - name: Check out pinned backend source
        if: steps.release.outputs.backend_repository != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.release.outputs.backend_repository }}
          ref: ${{ steps.release.outputs.backend_revision }}
          path: ${{ steps.release.outputs.backend_checkout_path }}

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          newest="$(/usr/bin/find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | /usr/bin/sort -V | /usr/bin/tail -1)"
          test -n "$newest" || { echo "No versioned Xcode installation found" >&2; exit 1; }
          sudo xcode-select -s "$newest"
          swift --version

      - name: Prepare Developer ID identity
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          RELEASE_BOOTSTRAP_TOKEN: ${{ secrets.RELEASE_BOOTSTRAP_TOKEN }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/wisent-desktop-release.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"

          if [ -n "$MACOS_CERT_P12" ] || [ -n "$MACOS_CERT_PASSWORD" ] || [ -n "$MACOS_SIGN_IDENTITY" ]; then
            : "${MACOS_CERT_P12:?MACOS_CERT_P12 is required when persistent signing is configured}"
            : "${MACOS_CERT_PASSWORD:?MACOS_CERT_PASSWORD is required when persistent signing is configured}"
            : "${MACOS_SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required when persistent signing is configured}"
            case "$MACOS_SIGN_IDENTITY" in
              'Developer ID Application:'*) ;;
              *) echo "MACOS_SIGN_IDENTITY must be a Developer ID Application identity" >&2; exit 1 ;;
            esac
            printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            identity="$MACOS_SIGN_IDENTITY"
          else
            : "${RELEASE_BOOTSTRAP_TOKEN:?RELEASE_BOOTSTRAP_TOKEN is required to provision the first signing identity}"
            : "${AC_API_KEY_ID:?AC_API_KEY_ID is required}"
            : "${AC_API_ISSUER_ID:?AC_API_ISSUER_ID is required}"
            : "${AC_API_KEY_P8:?AC_API_KEY_P8 is required}"
            printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/app-store-connect-key.p8"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/developer-id-key.pem"
            openssl req -new \
              -key "$RUNNER_TEMP/developer-id-key.pem" \
              -subj "/CN=Wisent desktop release" \
              -out "$RUNNER_TEMP/developer-id.csr"
            cat > "$RUNNER_TEMP/issue-developer-id.py" <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request

          def b64url(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=").decode()

          def read_length(value, offset):
              first = value[offset]
              if first < 128:
                  return first, offset + 1
              width = first & 127
              return int.from_bytes(value[offset + 1:offset + 1 + width], "big"), offset + 1 + width

          def jwt():
              header = b64url(json.dumps(
                  {"alg": "ES256", "kid": os.environ["AC_API_KEY_ID"], "typ": "JWT"},
                  separators=(",", ":"),
              ).encode())
              now = int(time.time())
              payload = b64url(json.dumps(
                  {"iss": os.environ["AC_API_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  separators=(",", ":"),
              ).encode())
              signing_input = f"{header}.{payload}".encode()
              signature = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", os.environ["ASC_KEY_PATH"]],
                  input=signing_input,
                  check=True,
                  capture_output=True,
              ).stdout
              if signature[0] != 0x30:
                  raise SystemExit("OpenSSL returned an invalid ES256 signature")
              _, position = read_length(signature, 1)
              values = []
              for _ in range(2):
                  if signature[position] != 0x02:
                      raise SystemExit("OpenSSL returned an invalid ES256 integer")
                  length, position = read_length(signature, position + 1)
                  values.append(int.from_bytes(signature[position:position + length], "big"))
                  position += length
              raw = values[0].to_bytes(32, "big") + values[1].to_bytes(32, "big")
              return f"{header}.{payload}.{b64url(raw)}"

          csr = pathlib.Path(os.environ["CSR_PATH"]).read_text()
          body = json.dumps({
              "data": {
                  "type": "certificates",
                  "attributes": {
                      "certificateType": "DEVELOPER_ID_APPLICATION",
                      "csrContent": csr,
                  },
              },
          }).encode()
          request = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/certificates",
              data=body,
              method="POST",
              headers={"Authorization": f"Bearer {jwt()}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"App Store Connect certificate request failed: {error.code} {error.read().decode()}") from error
          certificate = result["data"]
          pathlib.Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(certificate["attributes"]["certificateContent"])
          )
          print(certificate["id"])
          PY
            certificate_id="$(
              ASC_KEY_PATH="$RUNNER_TEMP/app-store-connect-key.p8" \
              CSR_PATH="$RUNNER_TEMP/developer-id.csr" \
              CERT_PATH="$RUNNER_TEMP/developer-id.cer" \
              python3 "$RUNNER_TEMP/issue-developer-id.py"
            )"
            test -n "$certificate_id"
            openssl x509 -inform DER -in "$RUNNER_TEMP/developer-id.cer" -out "$RUNNER_TEMP/developer-id.pem"
            security import "$RUNNER_TEMP/developer-id-key.pem" -k "$keychain" -T /usr/bin/codesign
            security import "$RUNNER_TEMP/developer-id.pem" -k "$keychain" -T /usr/bin/codesign
            identity="$(
              security find-identity -v -p codesigning "$keychain" |
                sed -n 's/^[[:space:]]*[0-9]*) [0-9A-F]* "\(Developer ID Application:[^"]*\)".*/\1/p' |
                head -1
            )"
            test -n "$identity" || { echo "issued certificate did not create a Developer ID identity" >&2; exit 1; }
            certificate_password="$(openssl rand -base64 48 | tr -d '\n')"
            export certificate_password
            openssl pkcs12 -export \
              -inkey "$RUNNER_TEMP/developer-id-key.pem" \
              -in "$RUNNER_TEMP/developer-id.pem" \
              -out "$RUNNER_TEMP/cert.p12" \
              -passout env:certificate_password
            base64 < "$RUNNER_TEMP/cert.p12" | tr -d '\n' |
              GH_TOKEN="$RELEASE_BOOTSTRAP_TOKEN" gh secret set MACOS_CERT_P12 --repo "$GITHUB_REPOSITORY"
            printf '%s' "$certificate_password" |
              GH_TOKEN="$RELEASE_BOOTSTRAP_TOKEN" gh secret set MACOS_CERT_PASSWORD --repo "$GITHUB_REPOSITORY"
            printf '%s' "$identity" |
              GH_TOKEN="$RELEASE_BOOTSTRAP_TOKEN" gh secret set MACOS_SIGN_IDENTITY --repo "$GITHUB_REPOSITORY"
            GH_TOKEN="$RELEASE_BOOTSTRAP_TOKEN" gh secret delete RELEASE_BOOTSTRAP_TOKEN --repo "$GITHUB_REPOSITORY"
          fi

          security list-keychains -d user -s "$keychain" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$identity\""
          printf 'WISENT_CODESIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          rm -f \
            "$RUNNER_TEMP/cert.p12" \
            "$RUNNER_TEMP/app-store-connect-key.p8" \
            "$RUNNER_TEMP/developer-id-key.pem" \
            "$RUNNER_TEMP/developer-id.csr" \
            "$RUNNER_TEMP/developer-id.cer" \
            "$RUNNER_TEMP/developer-id.pem" \
            "$RUNNER_TEMP/issue-developer-id.py"

      - name: Build application
        env:
          APP_PROVISIONING_PROFILE: ${{ secrets.WISENT_APP_PROVISIONING_PROFILE }}
          NETWORK_FILTER_PROVISIONING_PROFILE: ${{ secrets.WISENT_NETWORK_FILTER_PROVISIONING_PROFILE }}
          BUILD_COMMAND: ${{ steps.release.outputs.build_command }}
          WISENT_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WISENT_BUILD_NUMBER: ${{ github.run_number }}
          WISENT_UPDATE_FEED_URL: ${{ steps.release.outputs.feed_url }}
          WISENT_RESTART_AFTER_BUILD: '0'
          WISENT_INSTALL_AFTER_BUILD: '0'
        run: |
          set -euo pipefail
          if [ -n "${APP_PROVISIONING_PROFILE:-}" ]; then
            printf '%s' "$APP_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
            export WISENT_APP_PROVISIONING_PROFILE="$RUNNER_TEMP/app.provisionprofile"
          fi
          if [ -n "${NETWORK_FILTER_PROVISIONING_PROFILE:-}" ]; then
            printf '%s' "$NETWORK_FILTER_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/network-filter.provisionprofile"
            export WISENT_NETWORK_FILTER_PROVISIONING_PROFILE="$RUNNER_TEMP/network-filter.provisionprofile"
          fi
          /bin/bash -lc "$BUILD_COMMAND"

      - name: Verify bundle contract
        env:
          APP_PATH: ${{ steps.release.outputs.bundle_path }}
          EXPECTED_BUNDLE_ID: ${{ steps.release.outputs.bundle_id }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_FEED_URL: ${{ steps.release.outputs.feed_url }}
        run: |
          set -euo pipefail
          test -d "$APP_PATH"
          info="$APP_PATH/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$EXPECTED_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$info")" = "$EXPECTED_FEED_URL"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$info")"
          test -d "$APP_PATH/Contents/Frameworks/Sparkle.framework"
          codesign --verify --strict --deep --verbose=2 "$APP_PATH"

      - name: Notarize and staple bundle
        env:
          APP_PATH: ${{ steps.release.outputs.bundle_path }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${AC_API_KEY_ID:?AC_API_KEY_ID is required}"
          : "${AC_API_ISSUER_ID:?AC_API_ISSUER_ID is required}"
          : "${AC_API_KEY_P8:?AC_API_KEY_P8 is required}"
          printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Generate signed archive, appcast, and digests
        id: artifacts
        env:
          APP_PATH: ${{ steps.release.outputs.bundle_path }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          PRODUCT: ${{ steps.release.outputs.product }}
          VERSION: ${{ steps.release.outputs.version }}
          MINIMUM_SYSTEM_VERSION: ${{ steps.release.outputs.minimum_system_version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          output="$RUNNER_TEMP/wisent-release"
          feed="$RUNNER_TEMP/wisent-feed"
          mkdir -p "$output" "$feed"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$feed/$ARCHIVE_NAME"
          generate_appcast="$(/usr/bin/find .build -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          test -x "$generate_appcast" || { echo "Sparkle generate_appcast was not resolved by the app build" >&2; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          "$generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle-private-key" \
            --download-url-prefix "$release_prefix/" \
            --minimum-system-version "$MINIMUM_SYSTEM_VERSION" \
            "$feed"
          mv "$feed/$ARCHIVE_NAME" "$output/$ARCHIVE_NAME"
          mv "$feed/appcast.xml" "$output/appcast.xml"
          shasum -a 256 "$output/$ARCHIVE_NAME" "$output/appcast.xml" > "$output/DIGESTS"
          grep -F "$release_prefix/$ARCHIVE_NAME" "$output/appcast.xml"
          grep -F "sparkle:edSignature=" "$output/appcast.xml"
          printf 'archive=%s\n' "$output/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          printf 'appcast=%s\n' "$output/appcast.xml" >> "$GITHUB_OUTPUT"
          printf 'digests=%s\n' "$output/DIGESTS" >> "$GITHUB_OUTPUT"
          printf '%s %s\n' "$PRODUCT" "$VERSION" > "$RUNNER_TEMP/release-notes.txt"
          rm -f "$RUNNER_TEMP/sparkle-private-key"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.artifacts.outputs.archive }}
          APPCAST: ${{ steps.artifacts.outputs.appcast }}
          DIGESTS: ${{ steps.artifacts.outputs.digests }}
          PRODUCT: ${{ steps.release.outputs.product }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$PRODUCT $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$APPCAST" "$DIGESTS" \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/wisent-desktop-release.keychain-db" 2>/dev/null || true
